
name: KV Store Tests and Lint

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: python -m pip install ruff

      - name: Run lint
        run: ruff check --select E4,E7,E9,F main.py tests/

      - name: Run automated tests
        run: python -m unittest discover -s tests -v
